[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etabs_python"]

[project]
name = "etabs_python"
version = "3.1.0"
authors = [{ name = "Tuyen" }]
description = "Core engine for CSI ETABS data: live COM, Excel exports, SI units, FastAPI server"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "comtypes",
    "pywin32",
    "pandas",
    "openpyxl",
    "tqdm",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
