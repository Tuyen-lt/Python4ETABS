[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
exclude = ["test*"]

[project]
name = "etabs_python"
version = "2.0.0"
authors = [{ name = "Tuyen" }]
description = "High-performance Python data bridge and REST API for CSI ETABS"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "comtypes",
    "pywin32",
    "pandas",
    "openpyxl",
    "fastapi",
    "uvicorn",
    "python-multipart",
]
